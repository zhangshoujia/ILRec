optimizer:
  name: adam
  lr: 1.0e-3
  weight_decay: 0

train:
  epoch: 3000
  batch_size: 4096
  save_model: true
  log_loss: true
  loss: pairwise
  test_step: 3
  reproducible: true
  seed: 2023
  patience: 5

test:
  metrics: [recall, ndcg]
  k: [5, 10, 20]
  batch_size: 1024

data:
  type: general_cf
  name: amazon


model:
  name: nescl_pro
  # general parameters here
  keep_rate: 0.8
  embedding_size: 32
  # dataset-specific parameters here
  layer_num: 3
  reg_weight: 1.0e-6
  keep_rate: 0.2
  semantic_topk: 5
  sup_cl_weight: 0.1
  cv_sup_cl_weight: 0.1
  emb_cl_weight: 1e-3
  contrast_temperature: 0.1
  # for amazon
  amazon:
    ssl_reg: 0.1
    ssl_ratio: 0.3
    ssl_temp: 0.2
    # ssl_mode: 0-user side, 1-item side, 2-both side, 3-merge
    ssl_mode: 3
    # aug_type: 0-node dropout, 1-edge dropout, 2-random walk
    aug_type: 1

    sub_graph_pool: 300
    ssl_strategy: 9
    # positive_cl_type: 1-'out', 2='in'
    positive_cl_type: 1
    k: 5
    lightgcn_flag: False
    random_strategy: True
    augmentation: True
    early_stop: False
    add_initial_embedding: False
    #set_batch_nodes: False
    #add_more_neighbors: False
    pairwise_loss: True
    interacted_neighbors: True
    similar_user_neighbors: True
    similar_item_neighbors: True
    different_view: True

    different_view_weight: 1.0
    interacted_neighbors_weight: 1.0
    sample_item_weight: 1.0
    sample_user_weight: 1.0

    sample_item_weight_flag: False
    sample_user_weight_flag: False

    supcon_flag: false

    #renormalize_similarity: True
    prob_sampling: False

    device: 4
    neg_num: 1

    sup_contrast_temperature: 0.5
    sup_cl_weight: 2.0
    cv_sup_cl_weight: 0.05
    contrast_temperature: 1.5
    emb_cl_weight: 0.1
    reg_weight: 0.01
  toy:
    ssl_reg: 0.1
    ssl_ratio: 0.3
    ssl_temp: 0.2
    # ssl_mode: 0-user side, 1-item side, 2-both side, 3-merge
    ssl_mode: 3
    # aug_type: 0-node dropout, 1-edge dropout, 2-random walk
    aug_type: 1

    sub_graph_pool: 300
